line-length = 160

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PLW"]

[lint.per-file-ignores]
"dashboard/app.py" = [
    "BLE001",  # broad Exception is intentional for graceful UI degradation
    "C408",    # dict() vs literal: Plotly accepts both; dict() is cleaner here
]
"scripts/*" = [
    "E402",    # sys.path manipulation required before local imports in scripts
]
"streaming/*" = [
    "E402",    # sys.path manipulation required before local imports
]
